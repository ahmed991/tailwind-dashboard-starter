server {
    listen 80;

    # Serve React static build
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — all unmatched routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Express BFF proxy
    location /api/ {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # FastAPI auth routes (used by approval email links)
    location /auth/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # FastAPI proxy (direct calls from frontend to :8000)
    location /fastapi/ {
        rewrite            ^/fastapi/(.*)$ /$1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # Raster files served from FastAPI results volume
    location /raster/ {
        proxy_pass         http://api:8000/raster/;
        proxy_http_version 1.1;
    }
}
